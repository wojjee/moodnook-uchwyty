name: Build v8 + pre-render static product photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: pages }
      - name: Build v8 page (v6 chunks + patch, SHA-1 verified)
        run: |
          python3 main/cap/build_v8.py pages pages
          python3 main/cap/build_v8.py pages main
          cp main/cap/index.html pages/index.html
          cp main/cap/index.html main/index.html
          mkdir -p pages/v8/p && cp main/cap/nfstatic.js pages/v8/p/
          for f in 404.html robots.txt sitemap.xml; do cp main/cap/$f pages/$f; cp main/cap/$f main/$f; done
      - name: Render static WebP images
        run: |
          cd main/cap && npm i --no-save playwright-core@1 >/dev/null
          (cd ../../pages && python3 -m http.server 8774 >/dev/null 2>&1 &) ; sleep 2
          CHROME=$(which google-chrome) node capture.js http://localhost:8774/ ../../out
      - name: Thumbnail test - every photo present, non-blank, pre-rendered, 30/30 coverage (blocks deploy)
        run: |
          rm -rf pages/v8/p && cp -r out pages/v8/p
          (cd pages && python3 -m http.server 8775 >/dev/null 2>&1 &) ; sleep 2
          cd main/cap && CHROME=$(which google-chrome) node test_thumbs.js http://localhost:8775/ --static
      - name: Commit to gh-pages and main
        run: |
          for d in pages main; do
            rm -rf $d/v8/p && cp -r out $d/v8/p
            git -C $d config user.name "github-actions[bot]"
            git -C $d config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git -C $d add v8 index.html 404.html robots.txt sitemap.xml
            git -C $d diff --cached --quiet || git -C $d commit -m "v8.1: pre-render catalogue + configurator photos, EN photo fallback, typo fix"
            git -C $d push
          done
