name: one-off - remove pre-v13 leftovers from main
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove files site v13 does not use (Pages is served from gh-pages, CI reads only v13src)
        run: |
          git rm -r -q .nojekyll 404.html index.html klasyczna.html robots.txt sitemap.xml cap p v2 v3 v4 v5 v6 v8 v12 v12src
          git diff --cached --name-only > /tmp/removed.txt
          echo "removed: $(wc -l < /tmp/removed.txt) files"; awk -F/ '{print (NF>1?$1"/":$1)}' /tmp/removed.txt | sort | uniq -c
          test -f .github/workflows/site-v13.yml && test -f v13src/pack/SHA256SUMS_a && test -f v13src/pack/d/00.b64
          echo "::group::kept"; git ls-files; echo "::endgroup::"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "cleanup: remove pre-v13 leftovers from main (old v2-v12 builds, transfer chunks, v8 capture scripts, v12 sources, old root pages); Pages is served from gh-pages"
          git push -q
          git log -1 --format='%H'
